name: Recordatorios partidos River

on:
  schedule:
    - cron: '37 */3 * * *'   # cada 3 horas: toma partidos nuevos y reprogramaciones
  workflow_dispatch: {}

jobs:
  partidos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Cargar recordatorios de partidos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FOSFOVITA_ALARMA_BACKEND_URL: ${{ secrets.FOSFOVITA_ALARMA_BACKEND_URL }}
          FOSFOVITA_ALARMA_API_KEY: ${{ secrets.FOSFOVITA_ALARMA_API_KEY }}
        run: python monitor_river_partidos.py
